name: Application checks
on:
  push:
    branches: [codex/inwestapp-v1]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  python-and-chart:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12', '3.15']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python launch.py --check-installation
      - run: python -m unittest discover -s tests -q
      - run: node --test tests/test_chart.cjs
      - run: node --check web/automation.js
